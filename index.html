  html,body{margin:0;height:100%;background:#0a0a0a;color:#fff;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}

<!-- ====== iTaskManager · CARGADOR (v1.13) ======
  Este archivo NO cambia con cada versión: trae la pantalla desde el script de Google y la guarda en el navegador.
  Cuando hay versión nueva en el script, la app se actualiza sola. Solo hay que tocarlo si cambia el link /exec. -->
<div id="c"><svg width="72" height="72" viewBox="0 0 256 256"><rect width="256" height="256" rx="56" fill="#0a0a0a" stroke="#fff" stroke-opacity=".25" stroke-width="6"/><circle cx="68" cy="72" r="16" fill="#fff"/><rect x="56" y="100" width="24" height="96" rx="10" fill="#fff"/><rect x="100" y="60" width="112" height="28" rx="10" fill="#fff"/><rect x="142" y="60" width="28" height="136" rx="10" fill="#fff"/><path d="M150 216l18 16 36-34" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg><b>iTaskManager</b><div class="sp"></div><div id="m">Cargando…</div></div>
<script id="itm-puente" type="text/plain">
/* Puente: reemplaza google.script.run por fetch al /exec (doPost del script). Mismo código de pantalla que en Google. */
(function () {
  var OK_URL = /^https:\/\/script\.google\.com\/(a\/[\w.-]+\/)?macros\/s\/[\w-]+\/exec$/;
  function appUrl() {
    var u = String(window.WEB_APP || '').trim();
    try { var q = new URLSearchParams(location.search).get('app'); if (q && OK_URL.test(q)) localStorage.setItem('itm_app', q); } catch (e) {}
    if (!OK_URL.test(u)) { try { u = localStorage.getItem('itm_app') || ''; } catch (e) { u = ''; } }
    return OK_URL.test(u) ? u : '';
  }
  function llamar(nombre, args, ok, mal) {
    var u = appUrl();
    if (!u) { mal(new Error('Falta configurar el link de la app: en index.html pegá tu link /exec en WEB_APP.')); return; }
    if (nombre !== 'api') { mal(new Error('Función no disponible')); return; }
    var body = JSON.stringify({ fn: args[0], args: args[1] || [], clave: args[2] || '', entorno: args[3] || '', quien: args[4] || '' });
    var intento = function (n) {
      fetch(u, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body, redirect: 'follow', credentials: 'omit' })
        .then(function (r) { return r.json(); })
        .then(function (j) { if (j && j.ok) ok(j.r); else mal(new Error((j && j.error) || 'Error del servidor')); })
        .catch(function (e) { if (n > 0) setTimeout(function () { intento(n - 1); }, 1200); else mal(new Error('No hay conexión con el servidor. Revisá internet y probá de nuevo.')); });
    };
    intento(args[0] === 'webDatos' || args[0] === 'webNovCheck' ? 1 : 0);
  }
  function runner(ok, mal) {
    return new Proxy({}, { get: function (_, k) {
      if (k === 'withSuccessHandler') return function (f) { return runner(f, mal); };
      if (k === 'withFailureHandler') return function (f) { return runner(ok, f); };
      if (k === 'withUserObject') return function () { return runner(ok, mal); };
      return function () { llamar(String(k), Array.prototype.slice.call(arguments), ok || function () {}, mal || function (e) { console.error(e); }); };
    } });
  }
  window.google = { script: {
    get run() { return runner(null, null); },
    url: { getLocation: function (cb) {
      var p = {}; new URLSearchParams(location.search).forEach(function (v, k) { p[k] = v; });
      try {
        if (p.k) { localStorage.setItem('itm_k', p.k); history.replaceState(null, '', location.pathname + (p.env ? '?env=' + p.env : '')); }
        else { var k = localStorage.getItem('itm_k'); if (k) p.k = k; }
      } catch (e) {}
      cb({ parameter: p, hash: location.hash });
    } },
    host: { close: function () {}, setHeight: function () {}, setWidth: function () {} }
  } };
})();
</script>
<script>
window.WEB_APP = "https://script.google.com/macros/s/AKfycbywGJHIMpqHu43dpKH6j7Id4ynBImOK7QVCFcm2s1TdFxel8zVPVDoLc5m6_y6evxG8/exec";
(function () {
  var KC = 'itm_app_cache', puente = document.getElementById('itm-puente').textContent;
  var EXTRA = '<script>window.WEB_APP=' + JSON.stringify(window.WEB_APP) + ';window.ITM_LOADER=true;<\/script><script>' + puente + '<\/script>' +
    '<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">' +
    '<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">';
  function mostrar(html) {
    html = html.replace('<base target="_top">', '');
    var tag = '<meta charset="utf-8">', i = html.indexOf(tag);
    html = i >= 0 ? html.slice(0, i + tag.length) + EXTRA + html.slice(i + tag.length) : EXTRA + html;
    document.open(); document.write(html); document.close();
  }
  function leer() { try { return JSON.parse(localStorage.getItem(KC) || 'null'); } catch (e) { return null; } }
  function guardar(o) { try { localStorage.setItem(KC, JSON.stringify(o)); } catch (e) {} }
  function error(msg) {
    document.querySelector('.sp').style.display = 'none';
    document.getElementById('m').innerHTML = 'No se pudo cargar la app.<br>Revisá tu conexión y probá de nuevo.<br><small style="opacity:.6">' + msg + '</small><br><button onclick="location.reload()">Reintentar</button>';
  }
  var c = leer();
  if (c && c.html) { mostrar(c.html); return; }   // la app compara su versión con la del script y, si cambió, se actualiza sola
  var intento = function (n) {
    fetch(window.WEB_APP + '?vista=app', { credentials: 'omit', redirect: 'follow', cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (!j || !j.html) throw new Error('El script no devolvió la pantalla (¿está en la versión 1.13 o más nueva?)'); guardar({ v: j.v, html: j.html }); mostrar(j.html); })
      .catch(function (e) { if (n > 0) setTimeout(function () { intento(n - 1); }, 1500); else error(e.message); });
  };
  intento(1);
})();
</script>
